<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfcfb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Тема до первого кадра, в том числе при обновлении iOS standalone.
      try {
        const query = new URLSearchParams(location.search)
        const saved = query.get('demo') === '1' ? {} : JSON.parse(localStorage.getItem('dz-next:v1') || '{}')
        const theme = query.get('demo') === '1' ? query.get('theme') || 'light' : saved.theme || 'system'
        document.documentElement.dataset.motion = ['fast', 'normal', 'smooth'].includes(saved.animationSpeed) ? saved.animationSpeed : 'normal'
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = theme === 'black' ? 'black' : dark ? 'dark' : 'light'
        document.documentElement.style.backgroundColor = theme === 'black' ? '#000000' : dark ? '#17191d' : '#fdfcfb'
        document.querySelector('meta[name="theme-color"]').content = theme === 'black' ? '#000000' : dark ? '#17191d' : '#fdfcfb'
      } catch {}
    </script>
    <link rel="apple-touch-icon" href="./icon-stack-a-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-stack-a-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ДЗ</title>
  </head>
  <body><div id="root"></div><script type="module" src="/main.tsx"></script></body>
</html>
