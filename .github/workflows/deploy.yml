name: Publish app versions
on:
  push:
    branches: [main, codex/redesign, codex/rebuild]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: legacy
      - uses: actions/checkout@v4
        with:
          ref: codex/redesign
          path: codex
      - uses: actions/checkout@v4
        with:
          ref: codex/rebuild
          path: next
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            legacy/package-lock.json
            codex/package-lock.json
            next/package-lock.json
      - run: npm ci
        working-directory: legacy
      - run: npm ci
        working-directory: codex
      - run: npm ci
        working-directory: next
      - run: npm test
        working-directory: codex
      - run: npm run test:next
        working-directory: next
      - name: Prepare legacy PWA coexistence
        run: node next/scripts/prepare-legacy.mjs legacy
        env:
          LEGACY_BASE: /${{ github.event.repository.name }}/
      - run: npm run build
        working-directory: legacy
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - run: npm run build
        working-directory: codex
        env:
          BASE_PATH: /${{ github.event.repository.name }}/codex/
      - run: npm run build:design
        working-directory: next
        env:
          BASE_PATH: /${{ github.event.repository.name }}/next/
      - name: Assemble all versions
        run: |
          node codex/scripts/assemble-pages.mjs
          cp -R next/dist-design site/next
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/rebuild'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
