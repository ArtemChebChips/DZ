<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Недели и задачи — варианты</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ebeae7;color:#202329;font:15px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:950px;margin:30px auto;padding:0 16px;display:grid;grid-template-columns:1fr 390px;gap:28px}h1{font-size:25px;margin:0 0 14px}p{line-height:1.5}button{font:inherit;cursor:pointer;min-height:40px;border:1px solid #bfc2c8;border-radius:12px;padding:8px 12px;color:inherit;background:transparent}button[aria-pressed=true]{background:#dce7fa;border-color:#6091db}fieldset{border:0;padding:0;margin:20px 0}legend{font-weight:600;margin-bottom:8px}.choices{display:flex;gap:7px;flex-wrap:wrap}.phone{--bg:#17191d;--ink:#e7e9ed;--muted:#a0a7b3;--line:#33373e;--accent:#77a7ff;background:var(--bg);color:var(--ink);border-radius:30px;border:1px solid #555;width:390px;height:800px;display:flex;flex-direction:column;overflow:hidden}.phone.light{--bg:#fdfcfb;--ink:#202329;--muted:#69717e;--line:#dedfe3;--accent:#326ecb}.status{padding:18px 24px 0;font-size:13px;font-weight:600}.head{padding:24px 20px 18px}.head h2{font-size:32px;line-height:1.2;letter-spacing:-1px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:8px}.content{overflow:auto;flex:1;padding:0 20px 24px}.group{border:1px solid var(--line);border-radius:22px;margin:0 0 16px;padding:16px 12px}.group h3{font-size:18px;margin:0 0 4px}.range{color:var(--muted);font-size:12px;margin-bottom:14px}.task{display:flex;gap:10px;border:1px solid var(--line);border-radius:16px;padding:12px 10px;margin-top:8px;line-height:1.4}.check{width:21px;height:21px;border:1.5px solid var(--muted);border-radius:50%;flex-shrink:0;margin-top:15px}.small{font-size:12px;color:var(--muted)}.day{font-size:13px;color:var(--muted);margin-top:14px}.nav{height:76px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;font-size:12px;color:var(--muted)}.nav b{color:var(--accent);border:1px solid var(--line);border-radius:30px;padding:14px}.month{font-size:23px;margin:12px 0 20px}.weekdays,.row{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px}.weekdays{color:var(--muted);font-size:12px;margin-bottom:14px}.row button{border:0;border-radius:50%;padding:0;min-height:42px;font-size:15px}.row button.selected{background:var(--accent);color:var(--bg)}.row button.today{box-shadow:inset 0 0 0 1px var(--muted)}.weeklabel{font-size:11px;color:var(--muted);padding:14px 0 4px}.weekinfo{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:20px;line-height:1.5;font-size:14px}.lesson{border:1px solid var(--line);border-radius:22px;display:flex;margin-top:12px}.time{padding:16px 12px;border-right:1px solid var(--line);font-size:20px}.time span{display:block;color:var(--muted);margin-top:4px}.subject{padding:16px 12px;font-size:17px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.weekbutton{font-size:12px;color:var(--accent);border-color:var(--line)}.date{font-size:26px;margin-top:8px}.calendarbutton{color:var(--accent);width:48px;height:48px;border-color:var(--line);padding:10px}.footnote{font-size:12px;color:#626875}@media(max-width:800px){main{display:block;max-width:450px}.phone{margin:20px auto;width:100%;max-width:390px}h1{font-size:22px}}
</style>
<main><section><h1>Недели в «ДЗ»</h1><p>Интерактивные предложения в нынешнем стиле. Только примеры: данные приложения здесь не читаются.</p><fieldset><legend>Что смотрим</legend><div class="choices" id="mode"><button data-v="tasks">Группы задач</button><button data-v="calendar">Неделя и календарь</button></div></fieldset><fieldset><legend>Вариант</legend><div class="choices" id="variants"></div></fieldset><fieldset id="days"><legend>Сегодня</legend><div class="choices"><button data-date="2026-09-28">Пн, 28 сентября</button><button data-date="2026-10-02">Пт, 2 октября</button><button data-date="2026-10-04">Вс, 4 октября</button></div></fieldset><button id="theme">Светлая / тёмная</button><p id="description"></p><p class="footnote">Учебная неделя №1 — 31 августа–6 сентября. Это пока допущение для макета. Рекомендация: задачи 1 + календарь А.</p></section><section class="phone" id="phone"><div class="status">9:41</div><div class="head" id="header"></div><div class="content" id="content"></div><div class="nav" id="nav"></div></section></main>
<script>
let mode='tasks',variant=0,today='2026-09-28',selected='2026-09-28',opened=false;
const $=id=>document.getElementById(id),date=d=>new Date(d+'T12:00:00'),iso=d=>d.toISOString().slice(0,10),add=(d,n)=>{let x=date(d);x.setDate(x.getDate()+n);return iso(x)},monday=d=>add(d,-((date(d).getDay()+6)%7)),fmt=d=>date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}),week=d=>1+Math.round((date(monday(d))-date('2026-08-31'))/604800000),parity=d=>week(d)%2?'Числитель':'Знаменатель';
const tasks=[['2026-09-28','Физика','Решить задачи 3–7'],['2026-09-29','Механика','Подготовиться к семинару'],['2026-10-02','Английский','Выучить слова'],['2026-10-04','Тервер','Закончить домашнее задание'],['2026-10-05','Физика','Подготовить лабораторную'],['2026-10-08','Материаловедение','Повторить конспект'],['2026-10-14','Метрология','Оформить отчёт']];
const labels={tasks:['1. По неделям','2. Семь дней','3. Сначала срочное'],calendar:['А. Под сеткой','Б. Каждая неделя','В. В расписании']};
const descriptions={tasks:['Понедельник–воскресенье. В пятницу эта неделя не исчезает: видны оставшиеся дни, а следующая идёт отдельным блоком. Сегодня и завтра подписаны внутри.','Скользящие ближайшие семь дней. Удобно в пятницу, но группы уже не совпадают с учебными неделями.','Сегодня и завтра отдельным блоком. Остаток недели и следующая — ниже. Больше блоков, зато срочное сразу видно.'],calendar:['Под сеткой — номер и чётность выбранной недели. Нажми другой день: подпись обновится.','Номер и чётность над каждой строкой дней. Видно весь месяц, но календарь выше.','Небольшая кнопка «Неделя 5» в шапке расписания. Нажми её — откроется календарь с полной подписью.']};
function render(){ $('variants').innerHTML=labels[mode].map((l,i)=>`<button data-index="${i}" aria-pressed="${i===variant}">${l}</button>`).join('');document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===mode));document.querySelectorAll('[data-date]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.date===today));$('days').hidden=mode!=='tasks';$('description').textContent=descriptions[mode][variant];$('nav').innerHTML=mode==='tasks'?'<b>Задачи</b><span>Расписание</span><span>Настройки</span>':'<span>Задачи</span><b>Расписание</b><span>Настройки</span>';
if(mode==='tasks'){ $('header').innerHTML='<h2>Задачи</h2><div class="sub">'+fmt(today)+'</div>';let next=add(monday(today),7),after=add(next,7),seven=add(today,7);let groups=new Map();for(const t of tasks){let key=t[0]<today?'Просрочено':variant===1?(t[0]<seven?'Ближайшие 7 дней':'Позже'):variant===2&&t[0]<=add(today,1)?'Сегодня и завтра':t[0]<next?(variant===2?'Остаток этой недели':'Эта неделя'):t[0]<after?'Следующая неделя':'Позже';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t)}$('content').innerHTML=[...groups].map(([key,ts])=>{let range=key.includes('этой')||key==='Эта неделя'?fmt(monday(today))+' — '+fmt(add(next,-1)):key==='Следующая неделя'?fmt(next)+' — '+fmt(add(after,-1)):key==='Ближайшие 7 дней'?fmt(today)+' — '+fmt(add(seven,-1)):'';return `<section class="group"><h3>${key}</h3><div class="range">${range}</div>${ts.map(t=>`<div class="day">${t[0]===today?'Сегодня · ':t[0]===add(today,1)?'Завтра · ':''}${fmt(t[0])}</div><div class="task"><span class="check"></span><div><div class="small">${t[1]}</div>${t[2]}</div></div>`).join('')}</section>`}).join('');return}
if(variant===2&&!opened){$('header').innerHTML='<div class="toprow"><h2>Сегодня,</h2><button class="weekbutton" id="open">Неделя 5</button></div><div class="toprow"><div class="date">28 сентября</div><button class="calendarbutton" id="open2" aria-label="Календарь">▦</button></div>';$('content').innerHTML='<div class="lesson"><div class="time"><b>11:50</b><span>13:20</span></div><div class="subject"><b>Материаловедение</b><p class="small">Лекция · Каб. 301х</p></div></div>';return}
$('header').innerHTML='<h2>Выбрать день</h2>';$('content').innerHTML='<div class="month">Сентябрь 2026</div><div class="weekdays">'+['пн','вт','ср','чт','пт','сб','вс'].map(x=>'<span>'+x+'</span>').join('')+'</div>'+Array.from({length:5},(_,r)=>{let first=add('2026-08-31',r*7);return(variant===1?`<div class="weeklabel">${week(first)}-я неделя · ${parity(first)}</div>`:'')+'<div class="row">'+Array.from({length:7},(_,c)=>{let d=add(first,c);return `<button data-day="${d}" class="${d===selected?'selected':d==='2026-09-28'?'today':''}">${date(d).getDate()}</button>`}).join('')+'</div>'}).join('')+(variant!==1?`<div class="weekinfo">${week(selected)}-я учебная неделя · ${parity(selected)}<div class="small">${fmt(monday(selected))} — ${fmt(add(monday(selected),6))}</div></div>`:'');}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.v){mode=b.dataset.v;variant=0;opened=false}else if(b.dataset.index){variant=Number(b.dataset.index);opened=false}else if(b.dataset.date){today=b.dataset.date}else if(b.dataset.day){selected=b.dataset.day}else if(b.id==='theme'){$('phone').classList.toggle('light');return}else if(b.id==='open'||b.id==='open2'){opened=true}else return;render()});render();
</script></html>
