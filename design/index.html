<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfcfb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      html, body { margin: 0; background: #fdfcfb; color: #171b24; }
      html[data-theme='dark'], html[data-theme='dark'] body { background: #17191d; color: #eff0f3; }
      html[data-theme='black'], html[data-theme='black'] body { background: #000; color: #eff0f3; }
      #startup-shell { position: fixed; inset: 0; }
    </style>
    <script>
      // Только числа в памяти; до первого кадра диагностика ничего не сохраняет.
      window.__dzBoot = { marks: { pageScript: performance.now() }, hiddenAtStart: document.hidden, onlineAtStart: navigator.onLine }
      // До первого кадра не обращаемся к хранилищу, даже за темой.
      // Сохранённая палитра придёт вместе с notebook после стартовой оболочки.
      try {
        const query = new URLSearchParams(location.search)
        const theme = query.get('demo') === '1' ? query.get('theme') || 'light' : 'system'
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = theme === 'black' ? 'black' : dark ? 'dark' : 'light'
        document.documentElement.style.backgroundColor = theme === 'black' ? '#000000' : dark ? '#17191d' : '#fdfcfb'
        document.querySelector('meta[name="theme-color"]').content = theme === 'black' ? '#000000' : dark ? '#17191d' : '#fdfcfb'
      } catch { /* Оболочка остаётся доступна в светлой палитре. */ }
    </script>
    <link rel="apple-touch-icon" href="./icon-stack-a-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-stack-a-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ДЗ</title>
  </head>
  <body><div id="system-top" aria-hidden="true"></div><div id="root"><div id="startup-shell" aria-hidden="true"></div></div><script type="module" src="/main.tsx"></script></body>
</html>
